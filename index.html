<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>伪装主页</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background-color: #f0f0f0;
}
header {
  background-color: #202020;
  color: #fff;
  padding: 20px;
  text-align: center;
}
nav a {
  color: #fff;
  margin: 0 15px;
  text-decoration: none;
  font-weight: bold;
}
main {
  padding: 40px;
  text-align: center;
}
main h1 {
  font-size: 2em;
  margin-bottom: 20px;
}
main p {
  font-size: 1.2em;
  color: #333;
}
footer {
  background-color: #202020;
  color: #fff;
  text-align: center;
  padding: 10px;
  position: fixed;
  width: 100%;
  bottom: 0;
}
</style>
</head>
<body>
<header>
  <h1>伪装主页</h1>
  <nav>
    <a href="#">首页</a>
    <a href="#">热门</a>
    <a href="#">收藏</a>
    <a href="#">联系我们</a>
  </nav>
</header>
<main>
  <h1>欢迎来到这里</h1>
  <p>这是一个静态的伪装主页示例。</p>
</main>
<footer>
  © 2025 猎奇静态主页
</footer>
</body>
</html>
